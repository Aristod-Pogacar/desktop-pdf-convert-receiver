<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>PDF Receiver</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #e5e7eb;
            padding: 20px;
        }

        h1 {
            margin-top: 0;
            font-size: 22px;
            text-align: center;
            color: #38bdf8;
        }

        .ip-box {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }

        .ip-label {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .ip-value {
            font-size: 22px;
            font-weight: bold;
            color: #22c55e;
            letter-spacing: 1px;
        }

        .ip-hint {
            margin-top: 10px;
            font-size: 13px;
            color: #cbd5f5;
        }

        .section-title {
            font-size: 15px;
            margin-bottom: 10px;
            color: #cbd5f5;
        }

        .transfer-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .transfer-item {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .folder-name {
            font-size: 15px;
            font-weight: 600;
            color: #f8fafc;
        }

        .progress {
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
        }

        .completed {
            color: #22c55e;
        }

        .timed-out {
            color: #f97316;
        }

        .file-list {
            flex-basis: 100%;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1e293b;
        }

        .file-list ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .file-item {
            font-size: 13px;
            color: #cbd5f5;
            padding: 3px 0 3px 18px;
            position: relative;
            word-break: break-all;
        }

        .file-item::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #22c55e;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-top: 30px;
        }

        .button {
            background: #38bdf8;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .button:hover {
            background: #2563eb;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 20px;
            width: 100%;
            justify-content: center;
            justify-items: center;
            align-items: center;
            align-content: center;
        }
    </style>
</head>

<body>

    <h1>📥 Réception de fichiers PDF</h1>

    <!-- IP ADDRESS -->
    <div class="ip-box">
        <div class="ip-label">Adresse IP du PC</div>
        <div id="ip" class="ip-value">--.--.--.--</div>
        <div class="ip-hint">
            👉 Entrez cette adresse IP dans l’application mobile
        </div>
    </div>
    <!-- PASSWORD -->
    <div class="ip-box">
        <div class="ip-label">Mot de passe PDF</div>
        <input type="password" id="pdfPassword" placeholder="Entrer un mot de passe..." style="
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #1e293b;
            background: #020617;
            color: #e5e7eb;
        " />
        <div class="ip-hint">
            👉 Ce mot de passe sera utilisé automatiquement
        </div>
    </div>
    <div class="actions">
        <button id="openExcel" class="button">📊 Ouvrir l'historique Excel</button>
        <button id="openFolder" class="button">📂 Ouvrir le dossier des PDF</button>
    </div>

    <!-- TRANSFERS -->
    <div>
        <div class="section-title">Transferts en cours:</div>

        <ul id="transferList" class="transfer-list">
            <li class="empty">Aucun transfert pour le moment</li>
        </ul>
    </div>
    <script src="renderer.js"></script>

</body>

</html>
